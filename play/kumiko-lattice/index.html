<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Kumiko lattice: preview</title>
<style>html,body{margin:0;height:100%;background:#091030;overflow:hidden;overscroll-behavior:none}body{display:flex;flex-direction:column}
#bar{flex:0 0 auto;height:40px;display:flex;align-items:center;padding:0 10px;background:#091030;border-bottom:1px solid rgba(232,185,74,.35)}
#bar a{font:600 13px system-ui,sans-serif;color:#fbe8a0;text-decoration:none}
body.embed #bar{display:none}
canvas{display:block;flex:1 1 0;min-height:0;width:100vw;touch-action:none;-webkit-user-select:none;user-select:none}
#err{display:none;color:#fbe8a0;font:14px system-ui,sans-serif;padding:24px;text-align:center}</style></head>
<body><div id="bar"><a href="../../games/97-kumiko-lattice/">&lsaquo; Back to the game page</a></div><canvas id="game"></canvas><div id="err">This preview needs a modern browser with canvas support.</div>
<script type="module">
import { boot } from '../rt/platform/kit/index.js';
const q = new URLSearchParams(location.search);
if (q.has('embed')) document.body.classList.add('embed');
try {
  const get = async (f) => (await fetch(f)).json();
  const [spec, theme, text] = await Promise.all([get('spec.json'), get('theme.json'), get('text/en.json')]);
  const mod = await import('../rt/engines/' + spec.engine + '/src/engine.js');
  const { meta, createGame } = mod.createEngine(spec, theme, { ...text }, { autoplay: q.has('autoplay'), shot: q.has('shot'), begin: q.has('play') });
  boot({ createGame, meta, canvas: document.getElementById('game'), background: (theme.palette && theme.palette.bg) || '#091030' });
} catch (e) { document.getElementById('game').style.display = 'none'; document.getElementById('err').style.display = 'block'; console.error(e); }
</script></body></html>
